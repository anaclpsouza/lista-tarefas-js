<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Lista de Tarefas</title>
</head>

<body>
    <h1>Lista de Tarefas</h1>

    <header>
        <input type="text" name="" id="" placeholder="Digite sua tarefa">
        <button class="add">ADICIONAR</button>
    </header>

    <main id="areaLista">
        <div class="item">
            <div class="item-icone"> <span class="material-symbols-outlined unfill">circle</span></div>
            <div class="item-nome">Teste de tarefa</div>
            <div class="item-botao">
                <button class="delete"><span class="material-symbols-outlined">
                        delete
                    </span></button>
            </div>
        </div>

        <div class="item clicado">
            <div class="item-icone"><span class="material-symbols-outlined fill">
                    check_circle
                </span></div>
            <div class="item-nome">Teste de tarefa</div>
            <div class="item-botao">
                <button class="delete"><span class="material-symbols-outlined">
                        delete
                    </span></button>
            </div>
        </div>
    </main>
    <script src="js/controle.js"></script>
</body>

</html>
